      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="6" fill="#0a0a0f"/>
  <!-- Gradient underline -->
  <rect x="2" y="27" width="28" height="1.5" rx="0.75" fill="url(#g)" opacity="0.6"/>
  <!-- Shadow AW -->
