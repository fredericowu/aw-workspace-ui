name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Build static assets
        run: npm run build
