name: Release aw-workspace-ui static assets

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-aw-workspace-ui-static
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  release:
    name: Build + publish to Caddy static root
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ARTIFACT_NAME: aw-workspace-ui-dist
      AW_CONSOLE_DEPLOY_URL: https://console.aw.tekflox.com/api/deploy/aw-workspace-ui
    steps:
      - uses: actions/checkout@v7

      - name: Validate deploy secret
        run: |
          if [ -z "${{ secrets.AW_FRONTEND_DEPLOY_TOKEN }}" ]; then
            echo "::error::AW_FRONTEND_DEPLOY_TOKEN is required to publish static assets through aw-console."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build static assets
        run: npm run build

      - name: Upload static artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Deploy via aw-console webhook
        env:
          WEBHOOK_TOKEN: ${{ secrets.AW_FRONTEND_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          # Send the bytes we already have instead of asking aw-console to
          # fetch them back out of the GitHub artifact API. That pull is what
          # broke on 2026-08-25: the aw-console container has no outbound
          # route to api.github.com (UND_ERR_CONNECT_TIMEOUT on :443), so
          # every release failed at the download even though the build was
          # green. It also means no GITHUB_TOKEN has to leave the runner.
          ( cd dist && zip -qr ../dist.zip . )
          echo "dist.zip is $(stat -c%s dist.zip) bytes"

          # NOT `curl -f`: on a non-2xx it discards the response body and exits
          # 22, which is all the log ever showed for the 2026-08-25 outage —
          # "error: 500" and nothing about WHY. aw-console answers every
          # failure with a JSON {ok:false,error:"…"} naming the real cause, so
          # capture the body and the status separately and print the body.
          status="$(curl -sS -o /tmp/deploy-response.json -w '%{http_code}' \
            -X POST "$AW_CONSOLE_DEPLOY_URL" \
            -H "Authorization: Bearer $WEBHOOK_TOKEN" \
            -H "Content-Type: application/zip" \
            -H "X-AW-Repository: $GITHUB_REPOSITORY" \
            -H "X-AW-Run-Id: $GITHUB_RUN_ID" \
            -H "X-AW-Sha: $GITHUB_SHA" \
            --data-binary @dist.zip)"

          echo "aw-console responded HTTP $status:"
          cat /tmp/deploy-response.json
          echo ""

          if [ "$status" != "200" ]; then
            echo "::error::aw-console deploy webhook returned HTTP $status: $(jq -r '.error // "no error field"' /tmp/deploy-response.json 2>/dev/null || cat /tmp/deploy-response.json)"
            exit 1
          fi

          jq -e '.ok == true' /tmp/deploy-response.json >/dev/null

      - name: Summary
        run: |
          {
            echo "## aw-workspace-ui static release"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Artifact | \`$ARTIFACT_NAME\` |"
            echo "| Deployed by | \`$AW_CONSOLE_DEPLOY_URL\` |"
          } >> "$GITHUB_STEP_SUMMARY"
